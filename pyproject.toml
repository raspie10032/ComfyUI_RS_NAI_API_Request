[project]
name = "comfyui_rs_nai_api_request"
description = "NovelAI image generation for ComfyUI with V5 and Full Medium Effort, img2img, inpainting, multi-character prompts, multi-region detailing with local tagger matching and SAM/SEGM/external masks, Vibe Transfer, Precise Reference, reference insets, character assets, and prompt weight conversion."
version = "2.6.1"
license = { file = "LICENSE" }
dependencies = [
    "python-dotenv>=0.21.0",
    "requests>=2.31.0",
    "torch>=1.13.0",
    "numpy>=1.23.5",
    "Pillow>=9.3.0",
    "segment-anything>=1.0"
]

[project.optional-dependencies]
tagger = ["timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]
tagger-pixai = ["timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4", "transformers>=5,<6"]

[project.urls]
Repository = "https://github.com/raspie10032/ComfyUI_RS_NAI_API_Request"
