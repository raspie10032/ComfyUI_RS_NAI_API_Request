[project]
name = "comfyui_rs_nai_api_request"
description = "NovelAI image generation for ComfyUI with V5 and Full Medium Effort, img2img, inpainting, multi-character prompts and detailing, combined SEGM/BBOX/SAM detection, local tagger matching, hole/notch filling, image-restored NAI context with selective settings in T2I/img2img/detailer, Vibe Transfer, Precise Reference, reference insets, character assets, prompt weight conversion, PNG/WebP autosave preserving whole-image context and correction history, an integrated metadata loader, and cancellable request timers."
version = "2.9.2"
license = { file = "LICENSE" }
dependencies = [
    "python-dotenv>=0.21.0",
    "requests>=2.31.0",
    "torch>=1.13.0",
    "numpy>=1.23.5",
    "Pillow>=9.3.0",
    "segment-anything>=1.0",
    "scipy>=1.10"
]

[project.optional-dependencies]
tagger = ["timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4"]
tagger-pixai = ["timm>=1.0.3,<2", "huggingface-hub>=1.1,<2", "safetensors>=0.4", "transformers>=5,<6"]

[project.urls]
Repository = "https://github.com/raspie10032/ComfyUI_RS_NAI_API_Request"
